name: deb

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build packages for'
        required: true
        type: string
      dry_run:
        description: 'Build and check, attach nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deb:
    uses: excelano/.github/.github/workflows/deb.yml@main
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
