# Can a hosted macOS runner drive another application's window?
#
# The screenshot driver sizes a window through System Events and clicks through
# CGEventPost, and both are gated by TCC Accessibility. A refused click is not
# an error: the event is dropped and the capture succeeds, so the failure mode
# is a correctly sized photograph of the wrong thing. Asked here rather than
# found out from a screenshot nobody could explain.
name: ax-probe
on:
  workflow_dispatch:
jobs:
  ax:
    runs-on: macos-15
    steps:
      - name: Is this process trusted for Accessibility
        run: |
          cat > /tmp/ax.swift <<'SWIFT'
          import ApplicationServices
          print("AXIsProcessTrusted:", AXIsProcessTrusted())
          SWIFT
          swiftc -O /tmp/ax.swift -o /tmp/ax && /tmp/ax

      - name: What System Events says when asked to touch a window
        run: |
          osascript -e 'tell application "System Events" to get name of every process whose frontmost is true' \
            && echo "System Events answered" || echo "System Events refused"
